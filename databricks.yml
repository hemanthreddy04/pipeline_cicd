bundle:
  name: sample_pipeline

resources:
  jobs:
    sample_job:
      name: sample_job

      tasks:
        - task_key: source_to_bronze
          spark_python_task:
            python_file: ./bronze/source_bronze.py
          environment_key: default

        - task_key: bronze_to_silver
          depends_on:
            - task_key: source_to_bronze
          spark_python_task:
            python_file: ./silver/bronze_silver.py
          environment_key: default

        - task_key: silver_to_gold
          depends_on:
            - task_key: bronze_to_silver
          spark_python_task:
            python_file: ./gold/silver_gold.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "6"

targets:
  dev:
    mode: development

  prod:
    mode: production
    workspace:
      host: https://dbc-fa8c4e91-54a4.cloud.databricks.com
      root_path: /Workspace/Users/hemanthreddyofficial04@gmail.com/.bundle/${bundle.name}/${bundle.target}