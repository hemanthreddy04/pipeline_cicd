ontology_name: CustomerDomain
version: 1.0

entities:

  - name: Customer
    business_name: Customer
    description: Customer master information

    source:
      catalog: sample_ci_cd
      schema: gold
      table: dim_customers

    primary_key: customer_id

    attributes:

      - name: customer_id
        business_name: Customer ID
        type: string
        description: Unique customer identifier

      - name: first_name
        business_name: First Name
        type: string

      - name: last_name
        business_name: Last Name
        type: string

      - name: email
        business_name: Email Address
        type: string

      - name: phone
        business_name: Phone Number
        type: string

      - name: city
        business_name: City
        type: string

      - name: state
        business_name: State
        type: string

      - name: country
        business_name: Country
        type: string

      - name: signup_date
        business_name: Signup Date
        type: date

      - name: customer_segment
        business_name: Customer Segment
        type: string

      - name: status
        business_name: Customer Status
        type: string


  - name: CustomerMetrics
    business_name: Customer Metrics
    description: Metrics describing customer value and quality

    source:
      catalog: sample_ci_cd
      schema: gold
      table: fact_customer_metrics

    primary_key: customer_id

    attributes:

      - name: customer_id
        business_name: Customer ID
        type: string

      - name: lifetime_value
        business_name: Lifetime Value
        type: double
        metric: true

      - name: is_email_valid
        business_name: Email Valid
        type: boolean

      - name: silver_ingested_at
        business_name: Silver Ingested Timestamp
        type: timestamp

      - name: record_id
        business_name: Record ID
        type: bigint

      - name: gold_loaded_at
        business_name: Gold Loaded Timestamp
        type: timestamp


relationships:

  - name: customer_has_metrics

    from_entity: Customer
    to_entity: CustomerMetrics

    relationship_type: one_to_one

    join:
      from_column: customer_id
      to_column: customer_id

    description: Customer has associated metrics


business_terms:

  - name: Lifetime Value
    definition: Total value generated by a customer

  - name: Customer Segment
    definition: Classification of customers into groups

  - name: Active Customer
    definition: Customer whose status is Active


kpis:

  - name: Total Customers
    definition: Count of customers
    entity: Customer

  - name: Total Lifetime Value
    definition: Sum of customer lifetime value
    entity: CustomerMetrics

  - name: Valid Email Percentage
    definition: Percentage of customers with valid emails
    entity: CustomerMetrics